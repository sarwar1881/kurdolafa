<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gold gradient for accent -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8d5a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9d7f2e;stop-opacity:1" />
    </linearGradient>

    <!-- Black gradient -->
    <linearGradient id="blackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c1c1c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle - thin gold border -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#goldGradient)" stroke-width="2"/>

  <!-- Inner circle - black -->
  <circle cx="100" cy="100" r="88" fill="url(#blackGradient)"/>

  <!-- Decorative laurel wreath - gold -->
  <g fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left laurel branch -->
    <path d="M 45 100
             Q 55 85, 70 75
             Q 85 65, 100 60
             Q 115 65, 130 75
             Q 145 85, 155 100"
          opacity="0.6"/>

    <!-- Right laurel branch (mirrored) -->
    <path d="M 155 100
             Q 145 115, 130 125
             Q 115 135, 100 140
             Q 85 135, 70 125
             Q 55 115, 45 100"
          opacity="0.6"/>

    <!-- Laurel leaves - left side -->
    <g opacity="0.8">
      <ellipse cx="55" cy="90" rx="8" ry="4" transform="rotate(-30 55 90)"/>
      <ellipse cx="65" cy="80" rx="8" ry="4" transform="rotate(-45 65 80)"/>
      <ellipse cx="78" cy="72" rx="7" ry="3.5" transform="rotate(-55 78 72)"/>
      <ellipse cx="92" cy="68" rx="6" ry="3" transform="rotate(-65 92 68)"/>
    </g>

    <!-- Laurel leaves - right side -->
    <g opacity="0.8">
      <ellipse cx="145" cy="110" rx="8" ry="4" transform="rotate(30 145 110)"/>
      <ellipse cx="135" cy="120" rx="8" ry="4" transform="rotate(45 135 120)"/>
      <ellipse cx="122" cy="128" rx="7" ry="3.5" transform="rotate(55 122 128)"/>
      <ellipse cx="108" cy="132" rx="6" ry="3" transform="rotate(65 108 132)"/>
    </g>
  </g>

  <!-- Center emblem - Kurdish sun symbol (21 rays) -->
  <g transform="translate(100, 100)">
    <!-- Sun center -->
    <circle cx="0" cy="0" r="18" fill="url(#goldGradient)"/>
    <circle cx="0" cy="0" r="14" fill="url(#blackGradient)"/>
    <circle cx="0" cy="0" r="8" fill="url(#goldGradient)"/>

    <!-- 21 rays for Newroz/Kurdish symbolism -->
    <g stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-38" x2="0" y2="-52"/>
      <line x1="0" y1="38" x2="0" y2="52"/>
      <line x1="-38" y1="0" x2="-52" y2="0"/>
      <line x1="38" y1="0" x2="52" y2="0"/>
      <line x1="-27" y1="-27" x2="-37" y2="-37"/>
      <line x1="27" y1="-27" x2="37" y2="-37"/>
      <line x1="-27" y1="27" x2="-37" y2="37"/>
      <line x1="27" y1="27" x2="37" y2="37"/>
      <line x1="-15" y1="-48" x2="-20" y2="-60"/>
      <line x1="15" y1="-48" x2="20" y2="-60"/>
      <line x1="-48" y1="-15" x2="-60" y2="-20"/>
      <line x1="-48" y1="15" x2="-60" y2="20"/>
      <line x1="48" y1="-15" x2="60" y2="-20"/>
      <line x1="48" y1="15" x2="60" y2="20"/>
      <line x1="-15" y1="48" x2="-20" y2="60"/>
      <line x1="15" y1="48" x2="20" y2="60"/>
      <line x1="-10" y1="-40" x2="-13" y2="-50"/>
      <line x1="10" y1="-40" x2="13" y2="-50"/>
      <line x1="-40" y1="-10" x2="-50" y2="-13"/>
      <line x1="-40" y1="10" x2="-50" y2="13"/>
    </g>
  </g>

  <!-- Restaurant name text -->
  <text x="100" y="165"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11"
        font-weight="500"
        letter-spacing="3"
        text-anchor="middle"
        fill="url(#goldGradient)">
    KURDO LAFA
  </text>

  <!-- Subtitle -->
  <text x="100" y="178"
        font-family="'DM Sans', sans-serif"
        font-size="6"
        font-weight="400"
        letter-spacing="4"
        text-anchor="middle"
        fill="#737373"
        text-transform="uppercase">
    AUTHENTIC KURDISH CUISINE
  </text>
</svg>